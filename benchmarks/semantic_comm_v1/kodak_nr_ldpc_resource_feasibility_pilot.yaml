schema_version: 1
id: semantic_comm_v1.kodak_nr_ldpc_resource_feasibility_pilot
version: "0.1.0"
name: Kodak protected-SSCC resource feasibility pilot
description: Development-only accounting pilot used to construct a feasible protected-SSCC operating-point grid before publication protocol freeze. It executes no noisy channel and produces no held-out publication outcome.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
dataset:
  id: kodak
  modality: image
  version: kodak-development-21-24-128-v1
  split: development
  selection_role: development_only
  access_policy:
    state: unsealed_reusable
    publication_test: false
  preprocessing:
    operation_params:
      resize_shorter_side: 128
      crop_size: 128
      repeat_count: 1
    color_space: RGB
    sample_domain: uint8_0_255
    spatial_policy: aspect_resize_then_center_crop
  sample_ids: [kodim21, kodim22, kodim23, kodim24]
task:
  id: image_reconstruction
  kind: reconstruction
  modality: image
metrics:
  - id: channel.uses_per_pixel
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: channel_use/pixel
    direction: lower_is_better
  - id: rate.native_codec_bpp
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.serialized_payload_bpp
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.framed_bpp
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.coded_bpp
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.padded_bpp
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
baselines:
  - compressai_q1
recipes:
  - id: jpeg_q1
    label: JPEG q1
    role: robustness_operating_point
    path: recipes/pilots/jpeg_kodak_nr_ldpc_resource_pilot.yaml
    params: {step_params: {sender: {quality: 1}}}
  - id: jpeg_q5
    label: JPEG q5
    role: robustness_operating_point
    path: recipes/pilots/jpeg_kodak_nr_ldpc_resource_pilot.yaml
