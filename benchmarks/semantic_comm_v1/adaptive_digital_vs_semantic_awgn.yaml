schema_version: 1
id: semantic_comm_v1.adaptive_digital_vs_semantic_awgn
version: "0.2.0"
name: Adaptive Digital vs Semantic over AWGN
description: Experimental semantic-communication v1 adaptive-grid pack. It enumerates source quality, channel-code rate, modulation, and SNR points under a fixed channel-use budget, then compares the best digital points with returned semantic adapters.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
dataset:
  id: kodak
  modality: image
  version: kodak-adaptation-21-24-v1
  split: validation
  selection_role: adaptation_validation
  access_policy:
    state: reusable_validation
    publication_test: false
  preprocessing:
    operation_params:
      crop_size: 256
    color_space: RGB
    sample_domain: uint8_0_255
    spatial_policy: deterministic_center_crop
  sample_ids: [kodim21, kodim22, kodim23, kodim24]
  manifest:
    id: r0k.us-png-sha256-v1
    source_page: https://r0k.us/graphics/kodak/
    license_status: unverified_third_party_statement
    publication_ready: false
    files:
      - {sample_id: kodim21, filename: kodim21.png, size_bytes: 637051, sha256: ac958597c82073f6bb65129c68f72b651db5b9efd82e11547d07350214bc268b}
      - {sample_id: kodim22, filename: kodim22.png, size_bytes: 701970, sha256: 1cee58eb1f2d9c7ebb254d208a03c783ce6cf2c4d8c2cf45e235dd23b4ce1b29}
      - {sample_id: kodim23, filename: kodim23.png, size_bytes: 557596, sha256: e3111a2fd4da24af15d6459ef9eacfe54106b38e27b4a21821b75c3f5d2d5baf}
      - {sample_id: kodim24, filename: kodim24.png, size_bytes: 706397, sha256: 1071c68372cc5a01435c2c225a5cf7d4bb803846ec08bb6b3d6721b156d7cb96}
task:
  id: image_reconstruction
  kind: reconstruction
  modality: image
metrics:
  - id: channel.snr_db
    source_step: wireless_channel
    source_operations: [channel.capacity_oracle_digital_link, wireless.channel]
    family: channel
    unit: dB
    direction: neutral
  - id: quality.psnr_db
    source_step: evaluation
    source_operation: metrics.image_reconstruction
    family: reconstruction
    unit: dB
    direction: higher_is_better
  - id: channel.packet_success_rate
    family: transport
    unit: fraction
    direction: higher_is_better
  - id: channel.outage_rate
    family: transport
    unit: fraction
    direction: lower_is_better
  - id: channel.transmitted_bit_count
    family: rate
    unit: bits
    direction: lower_is_better
  - id: channel.channel_use_count
    source_step: wireless_channel
    source_operations: [channel.capacity_oracle_digital_link, wireless.channel]
    family: rate
    unit: symbols
    direction: lower_is_better
  - id: channel.uses_per_pixel
    family: rate
    unit: channel_use/pixel
    direction: lower_is_better
  - id: channel.code_rate
    family: transport
    unit: fraction
    direction: neutral
  - id: channel.bits_per_symbol
    family: transport
    unit: bit/symbol
    direction: neutral
  - id: rate.payload_bpp
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.framed_bpp
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.coded_bpp
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.padded_bpp
    family: rate
    unit: bit/pixel
    direction: lower_is_better
baselines:
  - adaptive_jpeg_protected_digital_grid
  - semantic_adapter_placeholder
recipes:
  - id: jpeg_q50_r1_qpsk_snr_0
    label: Adaptive JPEG q50 r1 QPSK
    role: adaptive_grid_baseline
    path: ../../recipes/jpeg_q75_kodak_repetition_awgn.yaml
    params:
      method_id: adaptive_jpeg_protected_digital_grid
      fixed_channel_use_budget: 0.5
      matrix_selection: {source.quality: 50, channel.code_rate: 1.0, modulation: qpsk, channel.snr_db: 0}
      metadata: {adaptive_grid: true, source_codec: jpeg, source_quality: 50, repetition_factor: 1, code_rate: 1.0, modulation: qpsk, fixed_channel_use_budget_per_pixel: 0.5}
      step_params: {sender: {quality: 50}, channel_encoder: {factor: 1}, channel_decoder: {factor: 1}, modulator: {modulation: qpsk}, wireless_channel: {snr_db: 0}}
