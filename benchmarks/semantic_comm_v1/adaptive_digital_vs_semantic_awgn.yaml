metadata:
  benchmark_tier: experimental
  protocol_id: noema.semantic_comm_v1.adaptive_digital_vs_semantic_awgn
  protocol_version: "0.2.0"
  benchmark_stage: semantic_comm_v1_seed
  publication_ready: false
  require_disjoint_training_lineage: true
  require_identical_source_transform: true
  heldout_status: adaptation_only_never_definitive_test
  resource_budget:
    metric: steps.wireless_channel.channel.max_source_item_uses_per_pixel
    maximum: 0.5
    tolerance: 1.0e-9
    policy: reject
    unit: channel_use/source_pixel
  adaptive_policy: exhaustive_grid_reference
  fixed_channel_use_budget_per_pixel: 0.5
  grid:
    source_quality: [50, 75]
    repetition_factor: [1, 3]
    code_rate: [1.0, 0.3333333333333333]
    modulation: [qpsk, qam16]
    snr_grid_db: [0, 8]
  selection_rule: Select the highest task score on this reusable validation population among points satisfying the fixed channel-use budget; the selected rule must be frozen before one execution on a separate sealed publication-test population.
  rate_accounting:
    payload_bits: payload_bit_boundary.channel.fixed.payload.bit_count
    transmitted_bits: tx_bit_boundary.channel.fixed.tx.bit_count
    channel_uses: wireless_channel.channel.channel_use_count
    channel_uses_per_pixel: wireless_channel.channel.uses_per_pixel
  expected_outputs:
    - result.json
    - metrics.csv
    - recipes.csv
    - summary.md
