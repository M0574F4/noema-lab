schema_version: 1
id: semantic_comm_v1.protected_digital_vs_deepjscc_awgn
version: "0.3.1-draft"
name: Protected SSCC vs DeepJSCC over AWGN
description: Experimental semantic-communication v1 benchmark pack for Sionna NR transport-block coding configured against TS 38.212, an abstract QPSK/AWGN link, a theoretical capacity oracle, and a returned DeepJSCC artifact on Kodak. This is not a full NR MCS, resource-grid, or PUSCH waveform implementation. Native codec rate and every modeled Noema/link overhead boundary are reported separately.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
dataset:
  id: kodak
  modality: image
  version: kodak-development-21-24-v1
  split: development
  selection_role: development_only
  access_policy:
    state: unsealed_reusable
    publication_test: false
  preprocessing:
    operation_params:
      crop_size: 256
    color_space: RGB
    sample_domain: uint8_0_255
    spatial_policy: deterministic_center_crop
  sample_ids: [kodim21, kodim22, kodim23, kodim24]
  manifest:
    id: r0k.us-png-sha256-v1
    source_page: https://r0k.us/graphics/kodak/
    license_status: unverified_third_party_statement
    publication_ready: false
    files:
      - {sample_id: kodim21, filename: kodim21.png, size_bytes: 637051, sha256: ac958597c82073f6bb65129c68f72b651db5b9efd82e11547d07350214bc268b}
      - {sample_id: kodim22, filename: kodim22.png, size_bytes: 701970, sha256: 1cee58eb1f2d9c7ebb254d208a03c783ce6cf2c4d8c2cf45e235dd23b4ce1b29}
      - {sample_id: kodim23, filename: kodim23.png, size_bytes: 557596, sha256: e3111a2fd4da24af15d6459ef9eacfe54106b38e27b4a21821b75c3f5d2d5baf}
      - {sample_id: kodim24, filename: kodim24.png, size_bytes: 706397, sha256: 1071c68372cc5a01435c2c225a5cf7d4bb803846ec08bb6b3d6721b156d7cb96}
task:
  id: image_reconstruction
  kind: reconstruction
  modality: image
metrics:
  - id: channel.snr_db
    source_step: wireless_channel
    source_operations: [channel.capacity_oracle_digital_link, wireless.channel]
    family: channel
    unit: dB
    direction: neutral
  - id: quality.psnr_db
    source_step: evaluation
    source_operation: metrics.image_reconstruction
    family: reconstruction
    unit: dB
    direction: higher_is_better
  - id: channel.packet_success_rate
    applicable_roles: &digital_all_roles [theoretical_baseline, baseline, baseline_operating_point]
    source_operations: [channel.capacity_oracle_digital_link, channel.crc32_check]
    family: transport
    unit: fraction
    direction: higher_is_better
  - id: channel.outage_rate
    applicable_roles: *digital_all_roles
    source_operations: [channel.capacity_oracle_digital_link, channel.crc32_check]
    family: transport
    unit: fraction
    direction: lower_is_better
  - id: channel.transmitted_bit_count
    applicable_roles: &physical_digital_roles [baseline, baseline_operating_point]
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bits
    direction: lower_is_better
  - id: channel.channel_use_count
    source_step: wireless_channel
    source_operations: [channel.capacity_oracle_digital_link, wireless.channel]
    family: rate
    unit: symbols
    direction: lower_is_better
  - id: channel.uses_per_pixel
    source_step: wireless_channel
    source_operations: [channel.capacity_oracle_digital_link, wireless.channel]
    family: rate
    unit: channel_use/pixel
    direction: lower_is_better
  - id: channel.code_rate
    applicable_roles: *physical_digital_roles
    source_step: channel_encoder
    source_operation: channel.nr_ldpc_encoder
    family: transport
    unit: fraction
    direction: neutral
  - id: channel.bits_per_symbol
    applicable_roles: *physical_digital_roles
    source_step: modulator
    source_operation: modulation.digital_modulate
    family: transport
    unit: bit/symbol
    direction: neutral
  - id: rate.payload_bpp
    applicable_roles: *digital_all_roles
    source_step: sender
    source_operations: [model.jpeg_encode, model.compressai_encode]
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.native_codec_bpp
    applicable_roles: *digital_all_roles
    source_step: sender
    source_operations: [model.jpeg_encode, model.compressai_encode]
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.serialized_payload_bpp
    applicable_roles: *digital_all_roles
    source_step: sender
    source_operations: [model.jpeg_encode, model.compressai_encode]
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.framed_bpp
    applicable_roles: *physical_digital_roles
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.coded_bpp
    applicable_roles: *physical_digital_roles
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
  - id: rate.padded_bpp
    applicable_roles: *physical_digital_roles
    source_step: resource_accounting
    source_operation: channel.communication_resource_accounting
    family: rate
    unit: bit/pixel
    direction: lower_is_better
