schema_version: 1
id: text_semantic_presets
version: "1"
name: Text Semantic Reconstruction Presets
description: Smoke-tier starter presets for text semantic communication experiments.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
dataset:
  id: semantic_text_smoke
  modality: text
  version: semantic-text-smoke-v1
task:
  id: text_semantic_similarity
  kind: semantic_reconstruction
  modality: text
metrics:
  - id: semantic.lexical_similarity
    family: semantic
    unit: score
    direction: higher_is_better
  - id: text.unigram_bleu_proxy
    family: text
    unit: score
    direction: higher_is_better
  - id: text.edit_similarity
    family: text
    unit: score
    direction: higher_is_better
  - id: text.exact_match
    family: text
    unit: fraction
    direction: higher_is_better
  - id: codec.bit_count
    family: rate
    unit: bits
    direction: lower_is_better
  - id: text.remaining_mask_count
    family: repair
    unit: count
    direction: lower_is_better
  - id: channel.channel_use_count
    family: rate
    unit: symbols
    direction: lower_is_better
baselines:
  - utf8_clean
recipes:
  - id: utf8_clean
    label: Raw UTF-8 clean
    role: baseline
    path: recipes/text_semantic_utf8_clean.yaml
  - id: utf8_mask_repair
    label: Raw UTF-8 mask + receiver repair
    role: candidate
    path: recipes/text_semantic_utf8_mask_repair.yaml
  - id: bart_jscc_clean
    label: BART JSCC-lite clean
    role: neural_symbol_baseline
    path: recipes/text_bart_jscc_clean.yaml
metadata:
  benchmark_tier: smoke
  benchmark_stage: text_transport_presets
  expected_runtime: short_to_medium
  optional_extras:
    - textgen
  notes:
    - Raw UTF-8 mask repair requires a bit-preserving payload codec so literal [MASK] tokens survive to receiver repair.
    - BART JSCC-lite is a generative semantic-symbol baseline; mask-token repair is intentionally disabled for it.
