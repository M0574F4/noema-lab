schema_version: 1
execution_profile:
  id: layered_digital
  version: 1
name: text_knowledge_assisted_transport
description: Knowledge-assisted text reconstruction using a compact SemanticState payload, a receiver knowledge base, and faithfulness metrics.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
metadata:
  research_stage: knowledge_assisted_semantic_state
  codec_profile: semantic_state
  codec_label: SemanticState + knowledge base payload codec
  codec_output_form: bits
  codec_format: semantic_state_json_utf8
  semantic_representation: semantic_state
  foundation_layer: true
  knowledge_base: semantic_text_smoke_kb
  channel_enabled: false
  channel_mode: disabled
  rate_count_fixed_point: tx_bit_boundary.channel.fixed.modulator_input.bit_count
  measure_codec_timing: true
  codec_timing:
    enabled: true
    runner: local_python
    warmup_runs: 0
    timed_runs: 1
steps:
  - id: data
    op: source.text_dataset
    params:
      dataset: semantic_text_smoke
      sample_ids: weather_report,robot_instruction,medical_note,traffic_alert,sensor_summary
      repeat_count: 1

  - id: knowledge_base
    op: foundation.knowledge_base
    params:
      kb_id: semantic_text_smoke_kb
      facts_json: ""
      max_builtin_concepts: 16

  - id: semantic_encoder
    op: foundation.text_semantic_state_encode
    inputs:
      texts: data.texts
    params:
      extractor: local_rules
      max_concepts: 16
      include_text: true

  - id: semantic_ground
    op: foundation.semantic_state_ground
    inputs:
      state: semantic_encoder.state
      kb: knowledge_base.kb
    params:
      min_token_overlap: 1
      max_matches_per_state: 12

  - id: sender
    op: foundation.semantic_state_payload_encode
    inputs:
      state: semantic_ground.state
    params:
      payload_format: semantic_state_json_utf8

  - id: payload_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: sender.bits
    params:
      label: payload_input
      role: payload_input

  - id: channel_encoder
    op: channel.identity_encoder
    inputs:
      bits: payload_bit_boundary.bits

  - id: tx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: channel_encoder.coded_bits
    params:
      label: modulator_input
      role: modulator_input

  - id: wireless_channel
    op: channel.identity_link
    inputs:
      bits: tx_bit_boundary.bits
    params:
      label: disabled_text_channel

  - id: rx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: wireless_channel.bits
    params:
      label: identity_channel_output
      role: identity_channel_output

  - id: channel_bit_count_match
    op: channel.bit_count_match
    inputs:
      reference: tx_bit_boundary.bits
      candidate: rx_bit_boundary.bits
    params:
      label: channel_io

  - id: channel_decoder
    op: channel.identity_decoder
    inputs:
      coded_bits: rx_bit_boundary.bits

  - id: payload_decoder
    op: foundation.semantic_state_payload_decode
    inputs:
      bits: channel_decoder.bits
    params:
      on_error: replace

  - id: receiver_semantic_ground
    op: foundation.semantic_state_ground
    inputs:
      state: payload_decoder.state
      kb: knowledge_base.kb
    params:
      min_token_overlap: 1
      max_matches_per_state: 12

  - id: receiver
    op: foundation.semantic_state_to_text
    inputs:
      state: receiver_semantic_ground.state
      kb: knowledge_base.kb
    params:
      generator: kb_reconstruct
      prefer_source_text: false

  - id: evaluation
    op: metrics.text_semantic_similarity
    inputs:
      reference: data.texts
      candidate: receiver.texts

  - id: faithfulness
    op: metrics.semantic_state_faithfulness
    inputs:
      reference: semantic_ground.state
      candidate: receiver_semantic_ground.state
      kb: knowledge_base.kb
