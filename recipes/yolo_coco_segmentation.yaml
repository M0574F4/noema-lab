schema_version: 1
execution_profile:
  id: task_inference
  version: 1
name: segmentation
description: COCO8 instance segmentation with a pretrained Ultralytics YOLO receiver and mask metrics.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
metadata:
  benchmark_id: yolo_coco8_segmentation
  benchmark_version: v1
  channel_enabled: false
  channel_mode: no_channel_full_image_segmentation_baseline
  codec_format: pretrained_yolo_full_image
  codec_label: Ultralytics YOLO instance segmenter
  codec_output_form: segmentation_mask
  codec_profile: yolo_segmentation
  codec_timing:
    enabled: true
    runner: pytorch
    runtime_adapter_available: true
    warmup_runs: 0
    timed_runs: 1
  measure_codec_timing: true
  research:
    task:
      id: segmentation
  research_stage: detection_segmentation
  semantic_representation: segmentation_masks
  transport_representation: none_no_channel_baseline
  ui_configured: true
  seed: 23
steps:
  - id: data
    op: source.coco8_segmentation
    inputs: {}
    params:
      dataset_dir: .noema/datasets/coco8-seg
      split: val
      limit: 4
      image_size: 320
      download: true
  - id: receiver
    op: foundation.yolo_segment
    inputs:
      images: data.images
    params:
      model_id: yolo11n-seg.pt
      device: cpu
      confidence: 0.25
      iou: 0.7
      mask_threshold: 0.5
  - id: evaluation
    op: metrics.segmentation
    inputs:
      reference: data.segmentation
      candidate: receiver.segmentation
    params: {}
