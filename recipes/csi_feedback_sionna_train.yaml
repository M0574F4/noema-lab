schema_version: 1
execution_profile:
  id: csi_feedback_downlink
  version: 1
name: csi_feedback_sionna_train
description: Architecture-neutral paired CSI feedback slots over a quantized limited-feedback path, with reconstructed-CSI MRT evaluated on held-out Sionna TDL MISO-OFDM channels.
suite:
  id: channel_estimation
  name: Channel Estimation
  status: experimental
  version: v1-draft
metadata:
  research_stage: differentiable_export_mvp
  ui_configured: true
  channel_enabled: true
  channel_mode: sionna_tdl_miso_ofdm
  wireless_backend: sionna
  csi_observation: perfect_at_ue
  feedback_transport: uniform_quantized_error_free
  feedback_dimension: 32
  feedback_bits_per_latent: 4
  feedback_bits_per_sample: 128
  seed: 53001
  research:
    dataset:
      id: sionna_correlated_miso_ofdm_csi
      modality: wireless
      version: sionna-tdl-miso-ofdm-csi-v1
      split: deterministic_disjoint_seed
    task:
      id: csi_compression_feedback
      kind: feedback_control
      modality: wireless
      target: maximize_downlink_rate_under_fixed_feedback_budget
      metrics:
        - csi_feedback.achieved_spectral_efficiency_bps_hz
        - csi_feedback.spectral_efficiency_retention
        - csi_feedback.nmse_db
        - csi_feedback.phase_invariant_cosine
        - csi_feedback.feedback_bits_per_sample
    metrics:
      - csi_feedback.achieved_spectral_efficiency_bps_hz
      - csi_feedback.perfect_csi_spectral_efficiency_bps_hz
      - csi_feedback.spectral_efficiency_retention
      - csi_feedback.spectral_efficiency_loss_bps_hz
      - csi_feedback.nmse
      - csi_feedback.nmse_db
      - csi_feedback.phase_invariant_cosine
      - csi_feedback.feedback_dimension
      - csi_feedback.original_real_dimension
      - csi_feedback.latent_fraction
      - csi_feedback.compression_factor
      - csi_feedback.feedback_bits_per_sample
      - csi_feedback.quantization_mse
      - csi_feedback.quantization_clipped_fraction
      - channel.snr_db
steps:
  - id: channel_state
    op: wireless.miso_ofdm_csi
    params:
      sample_count: 512
      tx_antennas: 8
      ofdm_fft_size: 32
      num_ofdm_symbols: 1
      tdl_model: A
      subcarrier_spacing_khz: 30.0
      carrier_frequency_ghz: 3.5
      delay_spread_ns: 300.0
      mobility_kmh: 3.0
      tx_correlation_coefficient: 0.7
      normalize_channel: true
      downlink_snr_db: 10.0
      wireless_backend: sionna
      seed: 53001

  - id: feedback_encoder
    op: model.csi_feedback_encoder
    inputs:
      csi: channel_state.csi
    params:
      runtime: training_interface
      feedback_dimension: 32

  - id: feedback_link
    op: channel.csi_feedback_link
    inputs:
      feedback_code: feedback_encoder.feedback_code
    params:
      mode: uniform_quantized
      bits_per_latent: 4
      clip_value: 1.0

  - id: feedback_decoder
    op: model.csi_feedback_decoder
    inputs:
      received_code: feedback_link.received_code
    params:
      runtime: training_interface
      feedback_dimension: 32

  - id: precoder
    op: model.csi_mrt_precoder
    inputs:
      reconstruction: feedback_decoder.reconstruction

  - id: evaluation
    op: metrics.csi_feedback
    inputs:
      true_csi: channel_state.csi
      reconstruction: feedback_decoder.reconstruction
      precoder: precoder.precoder
