schema_version: 1
execution_profile:
  id: layered_digital
  version: 1
name: text_semantic_utf8_mask_repair
description: Text semantic reconstruction recipe with sender-side [MASK] word noise, UTF-8 payload bits, and receiver masked-LM repair.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
metadata:
  research_stage: text_repair
  codec_profile: text_utf8
  codec_label: Text UTF-8 payload codec
  codec_output_form: bits
  codec_format: json_utf8
  semantic_representation: text
  receiver_repair: masked_lm
  receiver_repair_model_id: distilbert/distilbert-base-uncased
  channel_enabled: false
  channel_mode: disabled
  rate_count_fixed_point: tx_bit_boundary.channel.fixed.modulator_input.bit_count
  measure_codec_timing: true
  seed: 23
  codec_timing:
    enabled: true
    runner: local_python
    warmup_runs: 0
    timed_runs: 1
steps:
  - id: data
    op: source.text_dataset
    params:
      dataset: semantic_text_smoke
      sample_ids: weather_report,robot_instruction,medical_note,traffic_alert,sensor_summary
      repeat_count: 1

  - id: sender_source_perturbation
    op: noise.source_text_perturbation
    inputs:
      texts: data.texts
    params:
      mode: mask_words
      probability: 0.25
      mask_token: "[MASK]"
      seed: 169557333

  - id: sender
    op: model.text_utf8_encode
    inputs:
      texts: sender_source_perturbation.texts
    params:
      payload_format: json_utf8

  - id: payload_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: sender.bits
    params:
      label: payload_input
      role: payload_input

  - id: channel_encoder
    op: channel.identity_encoder
    inputs:
      bits: payload_bit_boundary.bits

  - id: tx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: channel_encoder.coded_bits
    params:
      label: modulator_input
      role: modulator_input

  - id: wireless_channel
    op: channel.identity_link
    inputs:
      bits: tx_bit_boundary.bits
    params:
      label: disabled_text_channel

  - id: rx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: wireless_channel.bits
    params:
      label: identity_channel_output
      role: identity_channel_output

  - id: channel_bit_count_match
    op: channel.bit_count_match
    inputs:
      reference: tx_bit_boundary.bits
      candidate: rx_bit_boundary.bits
    params:
      label: channel_io

  - id: channel_decoder
    op: channel.identity_decoder
    inputs:
      coded_bits: rx_bit_boundary.bits

  - id: receiver
    op: model.text_utf8_decode
    inputs:
      bits: channel_decoder.bits
    params:
      on_error: replace

  - id: receiver_repair
    op: foundation.text_mask_repair
    inputs:
      texts: receiver.texts
    params:
      generator: masked_lm
      model_id: distilbert/distilbert-base-uncased
      device: cpu
      top_k: 1

  - id: evaluation
    op: metrics.text_semantic_similarity
    inputs:
      reference: data.texts
      candidate: receiver_repair.texts
