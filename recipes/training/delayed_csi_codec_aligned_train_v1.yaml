schema_version: 1
name: delayed_csi_codec_aligned_train_capture_v1
description: Fresh stride-one causal/current CSI captures for codec-aligned allocator training.
execution_profile:
  id: custom
  version: 1
  based_on:
    id: layered_digital
    version: 1
suite:
  id: resource_allocation
  name: Resource Allocation
  status: experimental
  version: v1-codec-aligned
metadata:
  study_id: delayed-csi-codec-aligned-v1
  research_stage: prospective_training_capture
  publication_result_eligible: false
  capture_split: train
  seed_namespace: delayed_csi_codec_aligned_v1_train
  seed: 51000001
  seed_mode: increment_run_seed
  statistical_unit: one_independently_seeded_TDL_block
  sample_unit: aligned_delayed_current_CSI_state
  channel_model: Sionna_2.0.1_TDL-C_frequency_response
  final_outcomes_used: false
dataset_capture:
  matrix_mode: exclude
  taps:
    - id: csi_history
      from: csi_observation.transmitter_csi
    - id: current_csi
      from: csi_observation.actual_state
  split: train
  samples: 12288
  shard_size: 1536
  max_runs: 8
  seed_mode: increment_run_seed
steps:
  - id: data
    op: source.random_bits
    params:
      bit_count: 1024
      batch_size: 32
  - id: modulator
    op: modulation.digital_modulate
    inputs:
      bits: data.bits
    params:
      modulation: qpsk
  - id: channel_state
    op: wireless.ofdm_channel_state
    inputs:
      symbols: modulator.symbols
    params:
      tdl_model: C
      ofdm_fft_size: 128
      num_ofdm_symbols: 32
      capacity_multiplier: 16
      subcarrier_spacing_khz: 15.0
      carrier_frequency_ghz: 3.5
      delay_spread_ns: 1000.0
      mobility_kmh: 120.0
      noise_variance: 0.2
      average_power_budget: 0.4
      normalize_channel: false
  - id: csi_observation
    op: wireless.ofdm_delayed_csi
    inputs:
      state: channel_state.state
    params:
      feedback_delay_ofdm_symbols: 5
      csi_history_length: 4
      allocation_ofdm_symbols: 24
      capture_temporal_stride: 1
      add_estimation_noise: true
      csi_estimation_snr_db: 20.0
