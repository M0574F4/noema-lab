schema_version: 1
execution_profile:
  id: mimo_ofdm_channel_estimation
  version: 1
name: mimo_ofdm_mixed_tdl_ls_channel_estimation
description: Interpolation-aware LS estimation for the shared 2×2 MIMO-OFDM Sionna 3GPP TDL-A/C/E benchmark conditions.
suite:
  id: mimo_ofdm
  name: MIMO-OFDM
  status: experimental
  version: v1-draft
metadata:
  research_stage: learned_mimo_ofdm_channel_estimation
  channel_enabled: true
  channel_mode: sionna_3gpp_mixed_tdl_mimo_ofdm
  wireless_backend: sionna
  wireless_preset: 2×2 MIMO-OFDM · mixed 3GPP TDL-A/C/E · sparse orthogonal comb pilots
  seed: 23
  ui_configured: true
  matrix:
    dimensions:
      channel.snr_db: [-5, 0, 5, 10, 15, 20]
      channel.tdl_profile: [A, C, E]
    step_params:
      data:
        tdl_model:
          matrix: channel.tdl_profile
      pilot_observation:
        snr_db:
          matrix: channel.snr_db
  research:
    dataset:
      id: sionna_3gpp_mixed_tdl_mimo_ofdm_pilots
      modality: wireless
      version: sionna-tdl-ace-2x2-64sc-v2
      split: seeded_channel_realizations
    task:
      id: mimo_ofdm_channel_estimation
      kind: estimation
      modality: wireless
      target: estimator.estimate
      metrics:
        - mimo.channel_estimation.nmse
        - mimo.channel_estimation.zf_spectral_efficiency_bps_hz
        - mimo.channel_estimation.zf_rate_retention
    metrics:
      - mimo.channel_estimation.nmse
      - mimo.channel_estimation.nmse_db
      - mimo.channel_estimation.zf_spectral_efficiency_bps_hz
      - mimo.channel_estimation.perfect_csi_zf_spectral_efficiency_bps_hz
      - mimo.channel_estimation.zf_rate_retention
      - channel_estimation.complex_correlation
      - channel.snr_db
      - pilot.density
steps:
  - id: data
    op: source.ai_phy_channel_realization
    params:
      scenario: mimo_ofdm
      example_count: 64
      rx_antennas: 2
      tx_antennas: 2
      subcarriers: 64
      wireless_backend: sionna
      tdl_model: C
      subcarrier_spacing_khz: 30
      carrier_frequency_ghz: 3.5
      delay_spread_ns: 300
      mobility_kmh: 30
      normalize_channel: true

  - id: pilots
    op: source.ai_phy_pilot_pattern
    params:
      scenario: comb
      tx_antennas: 2
      subcarriers: 64
      pilot_spacing: 4
      seed: 1701

  - id: pilot_observation
    op: wireless.pilot_observation
    inputs:
      channel: data.channel
      pilots: pilots.pilots
    params:
      snr_db: 10
      wireless_backend: sionna

  - id: estimator
    op: model.ls_channel_estimator
    inputs:
      problem: pilot_observation.observation

  - id: evaluation
    op: metrics.channel_estimation
    inputs:
      problem: pilot_observation.truth
      estimate: estimator.estimate
