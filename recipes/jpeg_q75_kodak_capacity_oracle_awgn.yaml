schema_version: 1
execution_profile:
  id: layered_digital
  version: 1
name: jpeg_q75_kodak_capacity_oracle_awgn
description: JPEG q75 Kodak protected-digital theoretical baseline using a capacity-oracle AWGN link.
suite:
  id: semantic_comm
  name: Semantic Communication
  status: active
  version: v1
metadata:
  research_stage: protected_digital_baseline
  codec_profile: jpeg
  codec_label: JPEG q75 + capacity-oracle protected digital link
  codec_output_form: bits
  codec_format: "*.jpg"
  semantic_representation: bits
  channel_enabled: true
  channel_mode: capacity_oracle_awgn
  protected_digital_baseline: capacity_oracle
  protected_digital_note: The physical target is packetize/CRC/LDPC/QPSK/AWGN/soft-demapper/LDPC-decode/CRC-check. This MVP is a clearly labeled theoretical capacity-oracle reference, not an LDPC implementation.
  ldpc_rate: 0.5
  modulation: qpsk
  on_decode_failure: gray_image
  rate_count_fixed_point: tx_bit_boundary.channel.fixed.tx.bit_count
  matrix:
    dimensions:
      channel.snr_db: [-4, -2, 0, 2, 4, 6, 8, 10, 12]
    step_params:
      wireless_channel:
        snr_db:
          matrix: channel.snr_db
  measure_codec_timing: true
  codec_timing:
    enabled: true
    runner: pillow
    warmup_runs: 0
    timed_runs: 1
steps:
  - id: data
    op: source.image_dataset
    params:
      dataset: kodak
      dataset_dir: .noema/datasets/kodak
      image_ids: kodim01,kodim02,kodim03,kodim04,kodim05,kodim06,kodim07,kodim08,kodim09,kodim10,kodim11,kodim12,kodim13,kodim14,kodim15,kodim16,kodim17,kodim18,kodim19,kodim20,kodim21,kodim22,kodim23,kodim24
      crop_size: 0

  - id: sender
    op: model.jpeg_encode
    inputs:
      images: data.images
    params:
      quality: 75
      subsampling: "420"
      optimize: false
      progressive: false

  - id: payload_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: sender.bits
    params:
      label: payload
      role: payload

  - id: channel_encoder
    op: channel.identity_encoder
    inputs:
      bits: payload_bit_boundary.bits

  - id: tx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: channel_encoder.coded_bits
    params:
      label: tx
      role: protected_link_input

  - id: wireless_channel
    op: channel.capacity_oracle_digital_link
    inputs:
      bits: tx_bit_boundary.bits
    params:
      channel: awgn
      modulation: qpsk
      ldpc_rate: 0.5
      snr_db: -4
      on_decode_failure: gray_image
      label: jpeg_q75_capacity_oracle_awgn

  - id: rx_bit_boundary
    op: channel.bit_boundary
    inputs:
      bits: wireless_channel.bits
    params:
      label: rx
      role: protected_link_output

  - id: channel_bit_count_match
    op: channel.bit_count_match
    inputs:
      reference: tx_bit_boundary.bits
      candidate: rx_bit_boundary.bits
    params:
      label: protected_link_io

  - id: channel_decoder
    op: channel.identity_decoder
    inputs:
      coded_bits: rx_bit_boundary.bits

  - id: receiver
    op: model.jpeg_decode
    inputs:
      bits: channel_decoder.bits
    params:
      on_error: gray_image

  - id: evaluation
    op: metrics.image_reconstruction
    inputs:
      reference: data.images
      reconstruction: receiver.images
