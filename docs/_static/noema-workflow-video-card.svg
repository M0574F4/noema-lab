<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Open the complete Noema workflow</title>
  <desc id="desc">Noema video card for the recorded workflow from experiment contract through model training and paired comparison.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2fb47c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#background)"/>
  <rect width="1600" height="900" rx="34" fill="url(#glow)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="none" stroke="#27443a" stroke-width="2"/>

  <text x="800" y="142" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" text-anchor="middle" letter-spacing="3">NOEMA WORKFLOW</text>
  <text x="800" y="222" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="760" text-anchor="middle">From training contract to traceable comparison</text>
  <text x="800" y="276" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" text-anchor="middle">Clean setup · captured data · external training · returned model · paired baselines</text>

  <g filter="url(#shadow)">
    <circle cx="800" cy="415" r="82" fill="#5de2a5"/>
    <path d="M 780 375 L 780 455 L 850 415 Z" fill="#07110f"/>
  </g>
  <text x="800" y="548" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720" text-anchor="middle">PLAY COMPLETE WALKTHROUGH</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="105" y="660" width="250" height="72" rx="36" fill="#0d211c" stroke="#4ec5c1" stroke-width="2"/>
    <text x="230" y="705" fill="#4ec5c1">EXPORT CONTRACT</text>
    <path d="M 375 696 H 435" stroke="#5de2a5" stroke-width="4"/>
    <path d="M 423 684 L 437 696 L 423 708" fill="none" stroke="#5de2a5" stroke-width="4"/>

    <rect x="455" y="660" width="250" height="72" rx="36" fill="#0d211c" stroke="#5de2a5" stroke-width="2"/>
    <text x="580" y="705" fill="#5de2a5">CAPTURE DATA</text>
    <path d="M 725 696 H 785" stroke="#5de2a5" stroke-width="4"/>
    <path d="M 773 684 L 787 696 L 773 708" fill="none" stroke="#5de2a5" stroke-width="4"/>

    <rect x="805" y="660" width="250" height="72" rx="36" fill="#0d211c" stroke="#ffc857" stroke-width="2"/>
    <text x="930" y="705" fill="#ffc857">TRAIN MODEL</text>
    <path d="M 1075 696 H 1135" stroke="#5de2a5" stroke-width="4"/>
    <path d="M 1123 684 L 1137 696 L 1123 708" fill="none" stroke="#5de2a5" stroke-width="4"/>

    <rect x="1155" y="660" width="340" height="72" rx="36" fill="#102a23" stroke="#5de2a5" stroke-width="3"/>
    <text x="1325" y="705" fill="#effbf6">COMPARE BASELINES</text>
  </g>

  <text x="800" y="812" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Opens the playable walkthrough in the Noema documentation</text>
</svg>
