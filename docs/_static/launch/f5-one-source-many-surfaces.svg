<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One evidence source, many launch surfaces</title>
  <desc id="desc">The canonical launch evidence supplies README, documentation, webpage, experiment figure, result tables, and the recorded launch video.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#2fb47c" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5de2a5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ec5c1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#07110f"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="80" y="82" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" text-anchor="start" letter-spacing="2.5">F5 · ONE SOURCE, MANY SURFACES</text><text x="80" y="155" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="740" text-anchor="start">Every launch number has one place to change.</text><rect x="565" y="315" width="470" height="300" rx="36" fill="#102a23" stroke="#5de2a5" stroke-width="3"/><text x="800" y="380" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="1.8">CANONICAL GENERATED SOURCE</text><text x="800" y="455" fill="#effbf6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="37" font-weight="750" text-anchor="middle">launch_evidence.json</text><text x="800" y="506" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle">63 runs · 7 cells · 3 seeds</text><text x="800" y="552" fill="#4ec5c1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="500" text-anchor="middle">Evidence 52ed68b7adf7…</text><rect x="90" y="230" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="116" y="284" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">README</text><text x="116" y="326" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Launch headline</text><line x1="450" y1="300" x2="555" y2="465" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="470" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="116" y="524" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">Documentation</text><text x="116" y="566" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Methods + disclosure</text><line x1="450" y1="540" x2="555" y2="465" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="710" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="116" y="764" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">Web demo</text><text x="116" y="806" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Interactive contract audit</text><line x1="450" y1="780" x2="555" y2="465" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="1160" y="230" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="1186" y="284" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">Figure F3</text><text x="1186" y="326" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Series + observed range</text><line x1="1045" y1="465" x2="1150" y2="300" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="1160" y="470" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="1186" y="524" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">Tables T0–T2</text><text x="1186" y="566" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Comparisons + guardrails</text><line x1="1045" y1="465" x2="1150" y2="540" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="1160" y="710" width="350" height="140" rx="22" fill="#0d211c" stroke="#27443a" stroke-width="2"/><text x="1186" y="764" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" text-anchor="start">Launch video</text><text x="1186" y="806" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Recorded external walkthrough</text><line x1="1045" y1="465" x2="1150" y2="780" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="475" y="730" width="650" height="90" rx="18" fill="#251f0d" stroke="#705c23" stroke-width="2"/><text x="800" y="768" fill="#ffc857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="1.2">The warning travels with the number</text><text x="800" y="800" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="middle">Internally valid completed experimental benchmark; not a publication-ready canonical benchmark.</text>
</svg>
