<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From experiment contract to retained evidence</title>
  <desc id="desc">Five-stage Noema evidence chain from a typed protocol through execution and accounting to a generated launch projection.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#2fb47c" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5de2a5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ec5c1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#07110f"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="80" y="82" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" text-anchor="start" letter-spacing="2.5">F2 · CONTRACT → EVIDENCE</text><text x="80" y="155" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="740" text-anchor="start">One chain from declared question to retained result.</text><text x="80" y="205" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="start">Noema keeps the comparison coordinates attached while the experiment moves across tools.</text><rect x="70" y="335" width="220" height="250" rx="25" fill="#0d211c" stroke="#22966a" stroke-width="2"/><text x="94" y="382" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">01</text><text x="94" y="445" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Protocol</text><text x="94" y="495" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="94" dy="0">Typed methods, SNR</tspan><tspan x="94" dy="25.2">grid, metrics</tspan></text><line x1="300" y1="460" x2="362" y2="460" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="380" y="335" width="220" height="250" rx="25" fill="#0d211c" stroke="#22966a" stroke-width="2"/><text x="404" y="382" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">02</text><text x="404" y="445" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Execution</text><text x="404" y="495" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="404" dy="0">63 concrete runs</tspan></text><line x1="610" y1="460" x2="672" y2="460" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="690" y="335" width="220" height="250" rx="25" fill="#0d211c" stroke="#22966a" stroke-width="2"/><text x="714" y="382" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">03</text><text x="714" y="445" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Accounting</text><text x="714" y="495" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="714" dy="0">Integer bit / block</tspan><tspan x="714" dy="25.2">error counts</tspan></text><line x1="920" y1="460" x2="982" y2="460" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="1000" y="335" width="220" height="250" rx="25" fill="#0d211c" stroke="#22966a" stroke-width="2"/><text x="1024" y="382" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">04</text><text x="1024" y="445" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Evidence</text><text x="1024" y="495" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="1024" dy="0">Runs, identities,</tspan><tspan x="1024" dy="25.2">observed ranges</tspan></text><line x1="1230" y1="460" x2="1292" y2="460" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="1310" y="335" width="220" height="250" rx="25" fill="#0d211c" stroke="#5de2a5" stroke-width="2"/><text x="1334" y="382" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start">05</text><text x="1334" y="445" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Projection</text><text x="1334" y="495" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="1334" dy="0">launch_evidence.json</tspan></text><rect x="210" y="690" width="1180" height="118" rx="22" fill="#0a1b17" stroke="#27443a" stroke-width="2"/><text x="250" y="738" fill="#ffc857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="start" letter-spacing="1.5">LOCAL VERIFICATION BOUNDARY</text><text x="250" y="780" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start">Checks identities and declared relations; does not prove fairness, authenticity, or independent reproduction.</text>
</svg>
