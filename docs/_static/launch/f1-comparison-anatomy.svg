<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of a defensible comparison</title>
  <desc id="desc">Five aligned boundaries—condition, pairing, aggregation, metric, and role—feed one bounded quantitative claim.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#2fb47c" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5de2a5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ec5c1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#07110f"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="80" y="82" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" text-anchor="start" letter-spacing="2.5">F1 · COMPARISON ANATOMY</text><text x="80" y="155" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="740" text-anchor="start">A percentage is the end of the contract—not the start.</text><text x="80" y="205" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="start">A defensible claim survives only while every comparison boundary remains aligned.</text><rect x="80" y="310" width="232" height="250" rx="24" fill="#0d211c" stroke="#4ec5c1" stroke-width="2"/><text x="104" y="360" fill="#4ec5c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start">01</text><text x="104" y="425" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Condition</text><text x="104" y="475" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="104" dy="0">7 predeclared SNR</tspan><tspan x="104" dy="25.65">cells</tspan></text><line x1="196" y1="565" x2="800" y2="660" stroke="#4ec5c1" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="382" y="310" width="232" height="250" rx="24" fill="#0d211c" stroke="#5de2a5" stroke-width="2"/><text x="406" y="360" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start">02</text><text x="406" y="425" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Pairing</text><text x="406" y="475" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="406" dy="0">3 held-out seeds per</tspan><tspan x="406" dy="25.65">cell</tspan></text><line x1="498" y1="565" x2="800" y2="660" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="684" y="310" width="232" height="250" rx="24" fill="#0d211c" stroke="#ffc857" stroke-width="2"/><text x="708" y="360" fill="#ffc857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start">03</text><text x="708" y="425" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Aggregation</text><text x="708" y="475" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="708" dy="0">Same arithmetic mean</tspan></text><line x1="800" y1="565" x2="800" y2="660" stroke="#ffc857" stroke-width="4" marker-end="url(#arrow-amber)"/><rect x="986" y="310" width="232" height="250" rx="24" fill="#0d211c" stroke="#4ec5c1" stroke-width="2"/><text x="1010" y="360" fill="#4ec5c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start">04</text><text x="1010" y="425" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Metric</text><text x="1010" y="475" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="1010" dy="0">Pre-decoder BER / same</tspan><tspan x="1010" dy="25.65">bits</tspan></text><line x1="1102" y1="565" x2="800" y2="660" stroke="#4ec5c1" stroke-width="4" marker-end="url(#arrow-teal)"/><rect x="1288" y="310" width="232" height="250" rx="24" fill="#0d211c" stroke="#5de2a5" stroke-width="2"/><text x="1312" y="360" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="start">05</text><text x="1312" y="425" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="730" text-anchor="start">Role</text><text x="1312" y="475" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="1312" dy="0">Baseline · reference ·</tspan><tspan x="1312" dy="25.65">candidate</tspan></text><line x1="1404" y1="565" x2="800" y2="660" stroke="#5de2a5" stroke-width="4" marker-end="url(#arrow)"/><rect x="430" y="660" width="740" height="150" rx="30" fill="#102a23" stroke="#5de2a5" stroke-width="3"/><text x="800" y="713" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="1.8">CLAIM THAT SURVIVES THE AUDIT</text><text x="800" y="772" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" text-anchor="middle">At 10 dB, the learned receiver reduced mean pre-decoder BER by 98.87% relative to uncompensated QPSK.</text><text x="800" y="860" fill="#ffc857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">Internally valid completed experimental benchmark; not a publication-ready canonical benchmark.</text>
</svg>
