<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Noema: make the comparison traceable</title>
  <desc id="desc">Launch hero showing Noema&#x27;s contract-first claim and a bounded experimental QPSK receiver result.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b211b"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#2fb47c" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5de2a5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ec5c1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="700" fill="#07110f"/>
  <rect width="1600" height="700" fill="url(#glow)"/>
  <text x="92" y="92" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start" letter-spacing="2.8">NOEMA · EXECUTABLE EXPERIMENT CONTRACTS</text><text x="92" y="220" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="760" text-anchor="start"><tspan x="92" dy="0">Make the comparison</tspan><tspan x="92" dy="89.76">traceable.</tspan></text><text x="96" y="455" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="500" text-anchor="start"><tspan x="96" dy="0">Bind the protocol, execution, resource tracking, returned model,</tspan><tspan x="96" dy="39.15">terminal outcome, and retained evidence into one verifiable object.</tspan></text><rect x="96" y="590" width="230" height="46" rx="23" fill="#0a1b17" stroke="#5de2a5" stroke-width="2"/><text x="211" y="620" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">63 retained runs</text><rect x="344" y="590" width="210" height="46" rx="23" fill="#0a1b17" stroke="#5de2a5" stroke-width="2"/><text x="449" y="620" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">7 SNR cells</text><rect x="572" y="590" width="220" height="46" rx="23" fill="#0a1b17" stroke="#5de2a5" stroke-width="2"/><text x="682" y="620" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">3 paired seeds</text><rect x="1010" y="145" width="480" height="510" rx="34" fill="#0b201a" stroke="#22966a" stroke-width="3"/><text x="1065" y="210" fill="#5de2a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="start" letter-spacing="1.8">COMPLETED EXPERIMENTAL EVIDENCE</text><text x="1065" y="350" fill="#effbf6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="780" text-anchor="start">98.87%</text><text x="1068" y="397" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">BER reduction vs uncompensated · 10 dB</text><line x1="1065" y1="445" x2="1430" y2="445" stroke="#27443a" stroke-width="2"/><text x="1065" y="500" fill="#a9c1b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start"><tspan x="1065" dy="0">One synthetic QPSK demonstration.</tspan><tspan x="1065" dy="33">Observed min–max, not confidence intervals.</tspan><tspan x="1065" dy="33">Diagnostic oracle ≠ deployable competitor.</tspan></text>
</svg>
