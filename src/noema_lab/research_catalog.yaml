schema_version: 1
research_areas:
  - id: physical_layer_resource_optimization
    name: Physical layer & resource optimization
    order: 10
    description: Link transmission, classical and learned receivers, and radio-resource allocation.
  - id: channel_estimation_feedback
    name: Channel estimation & CSI feedback
    order: 20
    description: Pilot-aided channel recovery, MIMO-OFDM estimation, and limited-feedback CSI acquisition.
  - id: antennas_positioning_sensing
    name: Antennas, positioning & sensing
    order: 30
    description: Beamforming, localization, direction finding, and array-based sensing.
  - id: semantic_goal_oriented_communication
    name: Semantic & goal-oriented communication
    order: 40
    description: Source reconstruction and task-aware communication for text, images, speech, and multimodal AI.
datasets:
  - id: sionna_correlated_miso_ofdm_csi
    name: Sionna correlated MISO-OFDM CSI
    modality: wireless
    status: supported
    source_ops:
      - wireless.miso_ofdm_csi
    versions:
      - sionna-tdl-miso-ofdm-csi-v1
    description: Seeded complex downlink channel-state tensors from a spatially correlated Sionna 3GPP TDL MISO-OFDM model for CSI compression, feedback, and precoding evaluation.
  - id: sionna_3gpp_tdl_c_mimo_ofdm_pilots
    name: Sionna 3GPP TDL-C 2×2 MIMO-OFDM pilots
    modality: wireless
    status: experimental
    source_ops:
      - source.ai_phy_channel_realization
      - source.ai_phy_pilot_pattern
      - wireless.pilot_observation
    versions:
      - sionna-tdl-c-2x2-64sc-v1
    description: Seeded 2×2 frequency-domain channel tensors and sparse orthogonal comb-pilot observations from a Sionna 3GPP TDL-C model for channel-estimation training and paired evaluation.
  - id: sionna_3gpp_mixed_tdl_mimo_ofdm_pilots
    name: Sionna mixed-profile 2×2 MIMO-OFDM pilots
    modality: wireless
    status: experimental
    source_ops:
      - source.ai_phy_channel_realization
      - source.ai_phy_pilot_pattern
      - wireless.pilot_observation
    versions:
      - sionna-tdl-ace-2x2-64sc-v2
    description: Seeded 2×2 frequency-domain channel tensors and sparse orthogonal comb-pilot observations across 3GPP TDL-A/C/E profiles for covariance-mismatched channel-estimation training and paired evaluation.
  - id: synthetic_pilot_channel
    name: Synthetic pilot channel experiment
    modality: wireless
    status: supported
    source_ops:
      - source.ai_phy_channel_realization
      - source.ai_phy_pilot_pattern
      - wireless.pilot_observation
      - source.ai_phy_pilot_channel
    versions:
      - synthetic-pilot-channel-v1
    description: Seeded flat-SISO and MIMO-OFDM channel tensors, explicit pilot patterns, and SNR-controlled noisy observations for channel-estimation benchmarks.
  - id: synthetic_beamforming
    name: Synthetic beamforming channels
    modality: wireless
    status: supported
    source_ops:
      - source.beamforming_scenario
    versions:
      - synthetic-beamforming-v1
    description: Seeded multi-antenna channel vectors and codebooks for beam selection and precoding benchmarks.
  - id: synthetic_localization_geometry
    name: Synthetic localization geometry
    modality: wireless
    status: supported
    source_ops:
      - source.localization_geometry
      - wireless.range_observation
      - source.localization_sensing_scenario
    versions:
      - synthetic-localization-geometry-v1
    description: Seeded anchor geometry with a separate SNR-controlled range-observation contract for localization/sensing benchmarks.
  - id: synthetic_ula_aoa
    name: Synthetic ULA angle-of-arrival snapshots
    modality: wireless
    status: supported
    source_ops:
      - source.aoa_scene
      - wireless.ula_array_observation
    versions:
      - synthetic-ula-aoa-v1
    description: Seeded far-field source angles and narrowband complex snapshots from a half-wavelength uniform linear array under AWGN.
  - id: synthetic_ofdm_power_allocation
    name: Synthetic OFDM subcarrier power allocation
    modality: wireless
    status: supported
    source_ops:
      - source.resource_allocation_scenario
    versions:
      - synthetic-ofdm-power-allocation-v1
    description: Seeded tapped frequency-selective channels represented as parallel OFDM subcarrier power gains for fixed-sum-power allocation benchmarks.
  - id: synthetic_random_bits
    name: Synthetic random bit stream
    modality: bits
    status: supported
    source_ops:
      - source.random_bits
    versions:
      - synthetic-random-bits-v1
    description: Seeded canonical uint8 bit source for link-level receiver and transport benchmarks.
  - id: synthetic_modulation_iq
    name: Controlled synthetic modulation I/Q frames
    modality: wireless
    status: supported
    source_ops:
      - source.modulation_frames
      - wireless.modulation_awgn_observation
    versions:
      - synthetic-modulation-iq-blind-carrier-v1
    description: Balanced, seeded, fixed-length BPSK, QPSK, and 16-QAM frames with label truth kept in a separate artifact and explicit per-frame carrier phase, residual frequency offset, and AWGN.
  - id: synthetic_random_bits_sionna_tdl
    name: Synthetic bit stream over Sionna TDL OFDM
    modality: wireless
    status: supported
    source_ops:
      - source.random_bits
    versions:
      - synthetic-random-bits-sionna-tdl-v1
    description: Seeded canonical bit payloads paired with reproducible Sionna 3GPP TDL OFDM channel-state realizations for end-to-end power-allocation benchmarks and researcher-selected signal capture.
  - id: synthetic_random_bits_sionna_tdl_delayed_csi
    name: Synthetic short packets over temporally correlated Sionna TDL OFDM
    modality: wireless
    status: experimental
    source_ops:
      - source.random_bits
      - source.bit_manifest
    versions:
      - synthetic-random-bits-sionna-tdl-delayed-csi-v1
      - synthetic-random-bits-sionna-tdl-delayed-csi-v2
      - synthetic-random-bits-sionna-tdl-delayed-csi-three-tb-v2
    description: Seeded short-packet payloads over a wideband Sionna 3GPP TDL-C trajectory, with a four-snapshot causal complex-CSI history ending five OFDM symbols before its aligned current propagation state.
  - id: kodak_over_sionna_tdl
    name: Kodak payloads over Sionna TDL OFDM
    modality: wireless
    status: supported
    source_ops:
      - source.image_dataset
    versions:
      - kodak-smoke-kodim01-sionna-tdl-v1
    description: Existing Kodak image-source payloads transmitted through the canonical CompressAI pipeline and paired with reproducible Sionna 3GPP TDL OFDM channel states for power-allocation evaluation and researcher-selected signal capture.
  - id: kodak
    name: Kodak PhotoCD image set
    modality: image
    status: supported
    source_ops:
      - source.image_dataset
    versions:
      - kodak-24
      - kodak-smoke-kodim01
    description: Standard 24-image Kodak reconstruction benchmark.
  - id: bsds500
    name: Berkeley Segmentation Dataset and Benchmark 500
    modality: image
    status: experimental
    source_ops:
      - source.image_dataset
    versions:
      - bsds500-2013-official-splits
    description: Hash-inventoried retrieve-only BSDS500 train, validation, and test partitions for noncommercial research evaluation.
  - id: pirm-test
    name: PIRM 2018 high-resolution test images
    modality: image
    status: experimental
    source_ops:
      - source.image_dataset
    versions:
      - pirm-2018-test-hr
    description: Hash-inventoried retrieve-only PIRM 2018 high-resolution test split under the publisher-declared CC BY-NC-SA 4.0 terms.
  - id: local_npz_images
    name: Local NPZ image batch
    modality: image
    status: supported
    source_ops:
      - source.local_npz_images
    description: User-supplied image tensors stored as NumPy arrays.
  - id: semantic_text_smoke
    name: Semantic text smoke set
    modality: text
    status: supported
    source_ops:
      - source.text_dataset
    versions:
      - semantic-text-smoke-v1
    description: Small built-in sentence set for validating text semantic-reconstruction pipelines.
  - id: task_smoke
    name: Task-oriented smoke set
    modality: generic
    status: supported
    source_ops:
      - source.task_labels_smoke
    versions:
      - task-smoke-v1
    description: Small built-in label/prediction set for validating task-oriented benchmark metrics.
  - id: semantic_artifact_smoke
    name: Semantic artifact smoke set
    modality: multimodal
    status: supported
    source_ops:
      - source.semantic_artifacts_smoke
    versions:
      - semantic-artifact-smoke-v1
    description: Built-in typed semantic artifact set for validating embeddings, boxes, masks, captions, VQA answers, rankings, maps, and video-frame contracts.
  - id: coco_vqa_smoke
    name: Synthetic VQA smoke set
    modality: multimodal
    status: supported
    source_ops:
      - source.vqa_smoke
    versions:
      - coco-vqa-smoke-v1
    description: Synthetic image-question-answer set for goal-oriented wireless VQA plumbing only; not a benchmark.
  - id: vqa_small
    name: VQA small sample
    modality: multimodal
    status: supported
    source_ops:
      - source.vqa_small_hf
    versions:
      - soumyasj-vqa-dataset-small
    description: Tiny downloadable VQA-style image/question/answer dataset from Hugging Face, suitable for quick pretrained VQA sanity checks.
  - id: local_vqa_manifest
    name: Local VQA manifest
    modality: multimodal
    status: supported
    source_ops:
      - source.vqa_manifest
    description: User-provided JSON/JSONL image-question-answer manifest for real local VQA experiments.
  - id: coco128_detection
    name: COCO128 object detection
    modality: image
    status: supported
    source_ops:
      - source.coco128_detection
    versions:
      - ultralytics-coco128-v1
    description: Real COCO-derived 128-image object-detection subset packaged by Ultralytics with YOLO-format labels.
  - id: coco8_segmentation
    name: COCO8 segmentation
    modality: image
    status: supported
    source_ops:
      - source.coco8_segmentation
    versions:
      - ultralytics-coco8-seg-v1
    description: Real COCO-derived 8-image instance-segmentation subset packaged by Ultralytics with YOLO polygon labels.
  - id: coco_caption_smoke
    name: COCO caption smoke set
    modality: multimodal
    status: planned
    source_ops: []
    description: Planned compact captioning benchmark for image/text semantic communication.
  - id: retrieval_smoke
    name: Image-text retrieval smoke set
    modality: multimodal
    status: supported
    source_ops:
      - source.retrieval_smoke
    versions:
      - retrieval-smoke-v1
    description: Small built-in image/text retrieval set for validating CLIP-style ranking pipelines.
  - id: flickr8k
    name: Flickr8k image-caption retrieval
    modality: multimodal
    status: supported
    source_ops:
      - source.flickr8k_retrieval
    versions:
      - flickr8k-validation-v1
    description: Real Flickr8k image-caption pairs for compact CLIP-style image-text retrieval experiments.
  - id: synthetic_isac_frequency_response
    name: Synthetic joint communication/sensing OFDM response
    modality: wireless
    status: experimental
    source_ops:
      - source.isac_ofdm_scenario
    versions:
      - synthetic-isac-frequency-response-v1
    description: Seeded per-subcarrier communication and sensing gains with an explicit noise level, tradeoff weight, and fixed total-power budget.
  - id: synthetic_near_field_array
    name: Synthetic near-field coherent array observations
    modality: wireless
    status: experimental
    source_ops:
      - source.near_field_xl_mimo_scenario
    versions:
      - synthetic-near-field-array-v1
    description: Seeded 28 GHz spherical-wave coherent-pilot observations with separately retained range and angle truth.
  - id: synthetic_leo_ntn_track
    name: Synthetic LEO-NTN observation histories
    modality: wireless
    status: experimental
    source_ops:
      - source.leo_ntn_tracking_scenario
    versions:
      - synthetic-leo-ntn-track-v1
    description: Seeded bounded-kinematic histories of noisy Doppler and azimuth observations with separately retained future state and next-beam labels.
tasks:
  - id: csi_compression_feedback
    name: CSI compression and feedback
    area_id: channel_estimation_feedback
    kind: feedback_control
    modality: wireless
    status: supported
    target: feedback_decoder.reconstruction
    metrics:
      - csi_feedback.achieved_spectral_efficiency_bps_hz
      - csi_feedback.spectral_efficiency_retention
      - task.score
    optional_metrics:
      - csi_feedback.perfect_csi_spectral_efficiency_bps_hz
      - csi_feedback.spectral_efficiency_loss_bps_hz
      - csi_feedback.nmse
      - csi_feedback.nmse_db
      - csi_feedback.phase_invariant_cosine
      - csi_feedback.feedback_dimension
      - csi_feedback.original_real_dimension
      - csi_feedback.latent_fraction
      - csi_feedback.compression_factor
      - csi_feedback.feedback_bits_per_sample
      - csi_feedback.quantization_mse
      - csi_feedback.quantization_clipped_fraction
      - channel.snr_db
      - memory.run.peak_rss_bytes
    description: Compress UE-observed downlink CSI, return it over an explicit limited feedback path, reconstruct it at the base station, and evaluate true-channel downlink precoding performance.
  - id: image_reconstruction
    name: Image reconstruction
    area_id: semantic_goal_oriented_communication
    kind: reconstruction
    modality: image
    status: supported
    target: receiver.images
    required_artifacts:
      reference: image.batch.numpy
      reconstruction: image.batch.numpy
    metrics:
      - quality.psnr_db
      - quality.mse
      - quality.mae
    optional_metrics:
      - quality.perfect_reconstruction_fraction
      - quality.ms_ssim
      - quality.ms_ssim.evaluated_fraction_of_total
      - quality.ms_ssim.evaluated_fraction_of_eligible
      - quality.ms_ssim.total_image_count
      - quality.ms_ssim.eligible_image_count
      - quality.ms_ssim.evaluated_image_count
      - codec.bit_count
      - codec.native_bit_count
      - codec.bytes
      - channel.payload_bit_count
      - channel.transmitted_bit_count
      - channel.channel_use_count
      - channel.uses_per_pixel
      - channel.snr_db
      - channel.tx_effective_snr_db
      - channel.packet_success_rate
      - channel.outage_rate
      - channel.code_rate
      - channel.bits_per_symbol
      - channel.awgn.capacity_bpp
      - codec.jpeg.selected_quality_mean
      - codec.jpeg.selected_quality_min
      - codec.jpeg.selected_quality_max
      - rate.native_codec_bpp
      - rate.serialized_payload_bpp
      - rate.payload_bpp
      - rate.framed_bpp
      - rate.coded_bpp
      - rate.padded_bpp
      - rate.bpp
      - rate_bpp
      - memory.run.peak_rss_bytes
    description: Compare received image batches against ground-truth source images.
  - id: pilot_channel_estimation
    name: Pilot channel estimation
    area_id: channel_estimation_feedback
    kind: estimation
    modality: wireless
    status: supported
    target: estimate.h_hat
    metrics:
      - channel_estimation.nmse
      - task.score
    optional_metrics:
      - channel_estimation.mse
      - channel.snr_db
      - mimo.channel_estimation.nmse
      - memory.run.peak_rss_bytes
    description: Estimate channel coefficients from pilot observations under fixed channel/noise protocols.
  - id: mimo_ofdm_channel_estimation
    name: MIMO-OFDM channel estimation
    area_id: channel_estimation_feedback
    kind: estimation
    modality: wireless
    status: supported
    target: estimate.h_hat
    metrics:
      - mimo.channel_estimation.nmse_db
      - mimo.channel_estimation.zf_spectral_efficiency_bps_hz
      - mimo.channel_estimation.zf_rate_retention
    optional_metrics:
      - mimo.channel_estimation.nmse
      - mimo.channel_estimation.perfect_csi_zf_spectral_efficiency_bps_hz
      - channel_estimation.nmse
      - channel_estimation.nmse_db
      - channel_estimation.mse
      - channel_estimation.complex_correlation
      - channel.snr_db
      - pilot.density
      - task.score
      - memory.run.peak_rss_bytes
    description: Estimate multi-antenna, multi-subcarrier channel tensors from pilot observations.
  - id: beamforming_precoding
    name: Beamforming and precoding
    area_id: antennas_positioning_sensing
    kind: link_optimization
    modality: wireless
    status: supported
    target: decision.weights
    metrics:
      - beamforming.spectral_efficiency_bps_hz
      - task.score
    optional_metrics:
      - beamforming.normalized_gain
      - beamforming.array_gain_db
      - channel.snr_db
      - memory.run.peak_rss_bytes
    description: Select or generate transmit beams/precoders under fixed channel and SNR protocols.
  - id: wireless_localization
    name: Wireless localization/sensing
    area_id: antennas_positioning_sensing
    kind: estimation
    modality: wireless
    status: supported
    target: estimate.positions
    metrics:
      - localization.rmse_m
      - task.score
    optional_metrics:
      - localization.mae_m
      - localization.p90_error_m
      - channel.snr_db
      - memory.run.peak_rss_bytes
    description: Estimate transmitter or object position from explicit wireless range observations.
  - id: aoa_estimation
    name: Angle-of-arrival estimation
    area_id: antennas_positioning_sensing
    kind: estimation
    modality: wireless
    status: supported
    target: estimate.angles_deg
    metrics:
      - aoa.rmse_deg
      - task.score
    optional_metrics:
      - aoa.mae_deg
      - aoa.median_error_deg
      - aoa.p90_error_deg
      - channel.snr_db
      - memory.run.peak_rss_bytes
    description: Estimate a far-field source angle from explicit antenna-array snapshots under a declared array geometry and noise protocol.
  - id: resource_allocation
    name: Resource allocation
    area_id: physical_layer_resource_optimization
    kind: policy_optimization
    modality: wireless
    status: supported
    target: decision.power
    metrics:
      - resource.theoretical_shannon_spectral_efficiency_bps_hz
      - task.score
    optional_metrics:
      - resource.theoretical_shannon_sum_bits_per_ofdm_symbol
      - resource.theoretical_min_subcarrier_spectral_efficiency_bps_hz
      - resource.theoretical_min_state_spectral_efficiency_bps_hz
      - resource.theoretical_p05_state_spectral_efficiency_bps_hz
      - resource.theoretical_outage_probability
      - resource.theoretical_outage_target_spectral_efficiency_bps_hz
      - resource.water_filling_oracle_spectral_efficiency_bps_hz
      - resource.water_filling_optimality_gap_bps_hz
      - resource.water_filling_relative_optimality_gap
      - resource.water_filling_power_rmse
      - resource.water_filling_power_normalized_rmse
      - resource.water_filling_kkt_normalized_residual
      - resource.average_transmit_power_budget
      - resource.fairness_jain
      - resource.power_constraint.max_abs_error
      - resource.power_constraint.max_relative_error
      - resource.power_constraint.max_negative_violation
      - resource.active_resource_element_fraction
      - resource.allocation_power_coefficient_of_variation
      - resource.allocated_power_weighted_channel_gain_lift
      - resource.water_filling.active_resource_element_fraction
      - resource.finite_blocklength.expected_goodput_bps_hz
      - resource.finite_blocklength.predicted_bler
      - resource.finite_blocklength.mean_capacity_bps_hz
      - resource.finite_blocklength.p05_goodput_bps_hz
      - resource.finite_blocklength.blocklength_channel_uses
      - resource.finite_blocklength.target_rate_bps_hz
      - resource.nominal_snr_db
      - resource.csi.feedback_delay_ofdm_symbols
      - resource.csi.feedback_delay_seconds
      - resource.csi.observed_actual_complex_correlation
      - resource.csi.observed_actual_gain_correlation
      - resource.csi.observed_actual_complex_nmse
      - channel.noise_variance
      - channel.snr_db
      - channel.tx_effective_snr_db
      - channel.coded.ber
      - channel.coded.bler
      - channel.payload.ber
      - channel.payload.bler
      - channel.offered_payload_bits_per_resource_element
      - channel.achieved_payload_goodput_bits_per_resource_element
      - channel.goodput_to_theoretical_shannon_efficiency_ratio
      - channel.payload_energy_efficiency_bits_per_normalized_energy
      - channel.tx_energy_per_delivered_payload_bit
      - channel.payload_delivery_block_error_rate
      - channel.payload_delivery_success
      - channel.scheduled_resource_element_count
      - channel.data_bearing_resource_element_count
      - channel.resource_element_utilization
      - channel.nr_ldpc_ofdm.all_attempt_goodput_bits_per_occupied_data_resource_element
      - channel.nr_ldpc_ofdm.transport_block_error_rate
      - channel.nr_ldpc_ofdm.transport_block_crc_failure_count
      - channel.nr_ldpc_ofdm.attempted_transport_block_count
      - channel.nr_ldpc_ofdm.delivered_transport_block_count
      - channel.nr_ldpc_ofdm.attempted_payload_bit_count
      - channel.nr_ldpc_ofdm.delivered_payload_bit_count
      - channel.nr_ldpc_ofdm.occupied_data_resource_element_count
      - channel.nr_ldpc_ofdm.simulator_executed_resource_element_count
      - channel.nr_ldpc_ofdm.simulator_grid_padding_resource_element_count
      - quality.psnr_db
      - memory.run.peak_rss_bytes
    description: Allocate a fixed sum-power budget across OFDM subcarriers for each frequency-selective channel-state snapshot.
  - id: neural_receiver_demapping
    name: Neural receiver demapping
    area_id: physical_layer_resource_optimization
    kind: transport_integrity
    modality: bits
    status: supported
    target: demodulator.bits
    metrics:
      - channel.coded.ber
      - channel.coded.bler
    optional_metrics:
      - channel.snr_db
      - channel.transmitted_bit_count
      - channel.channel_use_count
      - channel.bits_per_symbol
      - channel.pilot_overhead_fraction
      - channel.effective_payload_bits_per_channel_use
      - channel.carrier.initial_phase_abs_mean_rad
      - channel.carrier.cfo_abs_mean_cycles_per_symbol
      - channel.carrier.phase_noise_increment_std_rad
      - channel.carrier.phase_drift_rms_rad
      - channel.coded.error_count
      - channel.coded.compare_bit_count
      - channel.coded.block_error_count
      - channel.coded.block_count
      - receiver.neural_receiver_adapter
    description: Recover transmitted bits from channel symbols using classical or neural receiver adapters.
  - id: automatic_modulation_recognition
    name: Automatic modulation recognition
    area_id: physical_layer_resource_optimization
    kind: signal_classification
    modality: wireless
    status: supported
    target: receiver.prediction
    required_artifacts:
      reference: ai_phy.modulation_labels.numpy
      prediction: ai_phy.modulation_predictions.numpy
    metrics:
      - modulation_recognition.accuracy
      - modulation_recognition.balanced_accuracy
      - modulation_recognition.macro_f1
    optional_metrics:
      - modulation_recognition.frame_count
      - classification.balanced_accuracy
      - task.accuracy
      - task.score
      - channel.snr_db
      - channel.carrier.initial_phase_abs_mean_rad
      - channel.carrier.cfo_abs_mean_cycles_per_symbol
      - memory.run.peak_rss_bytes
    description: Classify fixed-length received I/Q frames as BPSK, QPSK, or 16-QAM under unknown carrier phase and residual frequency offset using a blind cumulant baseline, an oracle-synchronized diagnostic, or a portable I/Q-only learned classifier.
  - id: bit_transport
    name: Bit transport integrity
    area_id: physical_layer_resource_optimization
    kind: transport_integrity
    modality: bits
    status: supported
    metrics:
      - channel.ber
      - channel.payload.ber
      - channel.coded.ber
    optional_metrics:
      - channel.payload.error_count
      - channel.coded.error_count
      - channel.payload.compare_bit_count
      - channel.coded.compare_bit_count
    description: Measure bit-level agreement across channel and payload boundaries.
  - id: text_semantic_similarity
    name: Text lexical reconstruction similarity
    area_id: semantic_goal_oriented_communication
    kind: semantic_reconstruction
    modality: text
    status: supported
    target: receiver.texts
    required_artifacts:
      reference: text.batch.json
      reconstruction: text.batch.json
    metrics:
      - semantic.lexical_similarity
      - text.unigram_bleu_proxy
      - text.edit_similarity
      - text.exact_match
    optional_metrics:
      - codec.bit_count
      - codec.bytes
      - channel.payload_bit_count
      - channel.transmitted_bit_count
      - channel.channel_use_count
      - memory.run.peak_rss_bytes
      - faithfulness.concept_precision
      - faithfulness.concept_recall
      - faithfulness.concept_f1
      - faithfulness.entity_precision
      - faithfulness.entity_recall
      - faithfulness.entity_f1
      - faithfulness.fact_precision
      - faithfulness.fact_recall
      - faithfulness.fact_f1
      - faithfulness.unsupported_assertion_rate
      - faithfulness.fact_omission_rate
      - faithfulness.kb_fact_precision
      - text.remaining_mask_count
    description: Text reconstruction evaluated with explicit lexical-overlap proxies, literal exact match, and optional grounded SemanticState faithfulness metrics; no embedding-based semantic similarity is implied.
  - id: speech_recognition
    name: Speech recognition
    area_id: semantic_goal_oriented_communication
    kind: task_success
    modality: audio
    status: planned
    metrics:
      - task.wer
      - task.cer
      - task.accuracy
