[build-system]
requires = ["setuptools>=77", "pybind11>=2.12,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-lab"
version = "0.2.0.dev0"
description = "Executable experiment contracts and protocol-to-plot evidence for learned communications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mostafa Naseri" }
]
requires-python = ">=3.11,<3.14"
keywords = ["learned communications", "experiment contracts", "benchmark evaluation", "evidence provenance", "semantic communications", "learned compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.18,<5",
  "matplotlib>=3.7",
  "numpy>=1.20",
  "Pillow>=9.0",
  "PyYAML>=5.4"
]

[dependency-groups]
dev = [
  "tomli>=2.0; python_version < '3.11'"
]

[project.urls]
Repository = "https://github.com/M0574F4/noema-lab"
Documentation = "https://M0574F4.github.io/noema-lab/"
Issues = "https://github.com/M0574F4/noema-lab/issues"
Changelog = "https://github.com/M0574F4/noema-lab/blob/main/CHANGELOG.md"
Security = "https://github.com/M0574F4/noema-lab/security/advisories/new"

[project.optional-dependencies]
compressai = [
  "compressai>=1.2.0"
]
diffusers = [
  "diffusers>=0.29.0",
  "torch>=2.9.1,<3"
]
eflic = [
  "torch>=2.9.1,<3",
  "torchvision>=0.24,<1"
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.24,<2",
  "onnxscript>=0.2.0",
  "torch>=2.9.1,<3",
  "compressai>=1.2.0"
]
openvino = [
  "openvino>=2024.0",
  "onnx>=1.16",
  "onnxscript>=0.2.0",
  "torch>=2.9.1,<3",
  "compressai>=1.2.0"
]
wireless = [
  "torch>=2.9.1,<3",
  "sionna-no-rt>=2.0.1,<3"
]
textgen = [
  "torch>=2.9.1,<3",
  "transformers>=4.40,<6",
  "safetensors>=0.4"
]
vqa-data = [
  "pandas>=2.0",
  "pyarrow>=15"
]
retrieval-data = [
  "pandas>=2.0",
  "pyarrow>=15"
]
vision = [
  "torch>=2.9.1,<3",
  "torchvision>=0.24,<1",
  "ultralytics>=8.3"
]
foundation = [
  "torch>=2.9.1,<3",
  "torchvision>=0.24,<1",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "diffusers>=0.29.0",
  "accelerate>=0.29",
  "safetensors>=0.4"
]
upstream-lic = [
  "torch>=2.9.1,<3",
  "torchvision>=0.24,<1",
  "compressai>=1.2.0",
  "einops>=0.7",
  "timm>=0.9",
  "pytorch-msssim>=1.0.0",
  "pybind11>=2.12,<3",
  "cmake>=3.27"
]
neural = [
  "compressai>=1.2.0",
  "diffusers>=0.29.0",
  "torch>=2.9.1,<3",
  "torchvision>=0.24,<1",
  "einops>=0.7",
  "timm>=0.9",
  "pytorch-msssim>=1.0.0",
  "pybind11>=2.12,<3",
  "cmake>=3.27",
  "onnx>=1.16",
  "onnxruntime>=1.24,<2",
  "onnxscript>=0.2.0",
  "openvino>=2024.0"
]
docs = [
  "Sphinx>=7.2",
  "myst-parser>=2.0",
  "pydata-sphinx-theme>=0.15"
]

[project.scripts]
noema = "noema_lab.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"noema_lab" = ["research_catalog.yaml", "recipe_templates.yaml", "recipe_starters/*.yaml", "suites_catalog.yaml"]
"noema_lab.ui" = ["static/*"]
"noema_lab.ops.models" = ["model_catalog.yaml"]

