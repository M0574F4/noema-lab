[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*", "*-win32"]
test-requires = [
  "onnx>=1.16",
  "onnxruntime>=1.24,<2",
]
test-command = "python {project}/tools/smoke_installed_release.py --require-native-onnx"
